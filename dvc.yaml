stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  validate:
    cmd: python src/validate_data.py
    deps:
      - src/validate_data.py
      - data_contract.json
      - data/processed/train.csv
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
    outs:
      - models/model.pkl
  test:
    cmd: pytest tests/
    deps:
      - src/
      - tests/
      - models/model.pkl
